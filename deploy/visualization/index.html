<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go2</title>
<style>
:root{color-scheme:dark;font:13px/1.5 system-ui,sans-serif;background:#10161c;color:#d8e0e7}
*{box-sizing:border-box}html{width:100%;height:100%}body{margin:0;padding:10px;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;min-height:360px}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #2a343e;background:#141c24}
.panelhead{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}h2{font-size:14px;font-weight:500;margin:0}
.viewport{flex:1;min-height:0;position:relative;background:#101923;overflow:hidden}
.viewport canvas,.viewport img{position:absolute;inset:0;width:100%;height:100%;display:block}.viewport canvas{touch-action:none;cursor:grab}.viewport img{object-fit:contain;display:none}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#91a4b5;pointer-events:none;padding:16px}
.stale{position:absolute;top:10px;left:10px;color:#ffcf87;background:#352819;padding:4px 8px;display:none}
.tools{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;align-items:center}
button{border:1px solid #3b4a58;background:transparent;color:#bdcbd7;padding:4px 10px;border-radius:3px;cursor:pointer}button:hover,button[aria-pressed="true"]{background:#2a3947;color:#fff}
.legend{padding:8px 12px;color:#91a4b5;font-size:12px}.legend span{white-space:nowrap;margin-right:10px}
.dot{display:inline-block;width:7px;height:7px;margin-right:4px;background:var(--color)}
.status{flex-shrink:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;color:#91a4b5;font-size:12px}
#demo,#viewMode,#errors{color:#ffcf87}#viewMode:empty,#errors:empty{display:none}#viewMode{font-size:12px;padding:0 12px 8px}
#errors{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;font-size:12px}
@media(max-width:900px){body{height:auto;min-height:100vh;min-height:100dvh}.grid{grid-template-columns:1fr;flex:none;min-height:0}.panel{height:clamp(340px,65vh,720px);height:clamp(340px,65dvh,720px)}}
</style>
<main class="grid">
 <section class="panel"><div class="panelhead"><h2>前置 RGB</h2></div>
 <div class="viewport"><img id="rgb" alt="前置 RGB"><div id="rgbEmpty" class="empty">等待图像</div><div id="rgbStale" class="stale">图像已过期</div></div></section>
 <section class="panel"><div class="panelhead"><h2>地图</h2></div>
 <div class="viewport"><img id="mapImage" alt="导航地图"><div id="mapEmpty" class="empty">等待建图</div><div id="mapStale" class="stale">地图已过期</div></div>
 <div class="legend"><span><i class="dot" style="--color:#dcd9d2"></i>自由</span><span><i class="dot" style="--color:#d74b4b"></i>障碍</span><span><i class="dot" style="--color:#e4b973"></i>膨胀</span><span><i class="dot" style="--color:#37a046"></i>轨迹</span><span><i class="dot" style="--color:#1e82f5"></i>路径</span><span><i class="dot" style="--color:#3287d2"></i>Voronoi</span></div></section>
 <section class="panel"><div class="panelhead"><h2>累计点云图</h2></div>
 <div class="viewport"><canvas id="cloud" aria-label="累计点云"></canvas><div id="cloudEmpty" class="empty">等待点云</div><div id="cloudStale" class="stale">点云已过期</div></div>
 <div class="tools"><button id="reset" aria-pressed="true">背后跟随</button><button id="fit" aria-pressed="false">全图</button><button id="top">俯视</button></div>
 <div id="viewMode"></div><div class="legend" id="cloudMeta">浅灰：地面 · 彩色：其他高度</div></section>
</main>
<div class="status"><span id="connection">连接中</span><button id="reconnect" hidden>重新连接</button><span id="demo"></span><span id="task"></span><span id="performance"></span></div>
<div id="errors" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('cloud'), ctx=canvas.getContext('2d');
let data=null, yaw=-.75, pitch=.7, scale=42, center=[0,0,0], pan=[0,0], drag=null, autoFit=false, offline=true;
let follow=true;
let pollTimer=null, polling=false, cameraPose=null, cameraZoom=1;
const colors=Array.from({length:128},(_,i)=>`hsl(${205-i*1.35} 68% ${47+i*.12}%)`);
// Camera in robot coordinates: 3.2 m behind, 2.7 m above the base;
// look toward 1.2 m ahead / 0.45 m above the base, with a 72 degree vertical FOV.
function rearProject(p,pose,w,h,zoom=1){
 const dx=p[0]-pose.position[0],dy=p[1]-pose.position[1],dz=p[2]-pose.position[2];
 const c=Math.cos(pose.yaw),s=Math.sin(pose.yaw);
 const x=dx*c+dy*s+3.2,y=-dx*s+dy*c,z=dz-2.7;
 const length=Math.hypot(4.4,2.25),fx=4.4/length,fz=-2.25/length;
 const depth=x*fx+z*fz;
 if(depth<=.15)return [NaN,NaN,depth];
 const focal=h*.5/Math.tan(Math.PI/5)*zoom;
 return [w/2-y*focal/depth,h/2-(-fz*x+fx*z)*focal/depth,depth];
}
function project(p,w,h){
 if(follow&&cameraPose)return rearProject(p,cameraPose,w,h,cameraZoom);
 const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];
 const u=Math.cos(yaw)*x-Math.sin(yaw)*y,v=Math.sin(yaw)*x+Math.cos(yaw)*y;
 return [w/2+pan[0]+u*scale,h/2+pan[1]-(v*Math.sin(pitch)+z*Math.cos(pitch))*scale,v*Math.cos(pitch)-z*Math.sin(pitch)];}
function fitMap(w,h){
 const points=data?.cloud?.points||[], bounds=points.filter(p=>p.every(Number.isFinite));
 if(data?.pose_overlay)bounds.push(data.pose.position);
 if(!bounds.length)return;
 const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 for(const p of bounds)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i]);}
 center=lo.map((v,i)=>(v+hi[i])/2);pan=[0,0];
 let maxU=1,maxV=1;
 for(const p of bounds){const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];
  maxU=Math.max(maxU,Math.abs(Math.cos(yaw)*x-Math.sin(yaw)*y));
  maxV=Math.max(maxV,Math.abs((Math.sin(yaw)*x+Math.cos(yaw)*y)*Math.sin(pitch)+z*Math.cos(pitch)));}
 scale=Math.max(.001,Math.min(w*.42/maxU,h*.42/maxV));
}
function draw(){const box=canvas.getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 if(autoFit||(follow&&!cameraPose))fitMap(w,h);
 if(follow&&cameraPose)center=[...cameraPose.position];
 $('viewMode').textContent=follow?(cameraPose?(offline||!data?.pose_overlay?'位姿不可用，视角已冻结':''):'等待位姿，暂示全图'):'';
 canvas.title=follow?'滚轮缩放':'拖动旋转 · 滚轮缩放 · Shift + 拖动平移';
 $('reset').setAttribute('aria-pressed',String(follow));$('fit').setAttribute('aria-pressed',String(autoFit));
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const line=(a,b,c)=>{a=project(a,w,h);b=project(b,w,h);if(!Number.isFinite(a[0])||!Number.isFinite(b[0]))return;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();};
 const spacing=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(w,h)/Math.max(scale,.001)/16))));
 const cx=Math.round(center[0]/spacing)*spacing,cy=Math.round(center[1]/spacing)*spacing,cz=0;
 for(let n=-10;n<=10;n++){line([cx+n*spacing,cy-10*spacing,cz],[cx+n*spacing,cy+10*spacing,cz],'#20303d');line([cx-10*spacing,cy+n*spacing,cz],[cx+10*spacing,cy+n*spacing,cz],'#20303d');}
 if(data?.cloud){ctx.globalAlpha=(offline||data.cloud.stale)? .32:1;
  const pts=data.cloud.points.map(p=>{let s=project(p,w,h);s.push(p[2]);return s;}).filter(p=>p[0]>=0&&p[0]<w&&p[1]>=0&&p[1]<h).sort((a,b)=>b[2]-a[2]);
  for(const p of pts){const t=Math.max(0,Math.min(127,Math.round((p[3]+.4)/2.8*127)));ctx.fillStyle=data.cloud.ground_relative_z&&Math.abs(p[3])<=.08?'#b8c4cf':colors[t];ctx.fillRect(p[0],p[1],2,2);}ctx.globalAlpha=1;
 }
 if(!offline&&data?.pose_overlay){
  const p=data.pose.position,q=data.pose.yaw,c=Math.cos(q),s=Math.sin(q);
  const world=([x,y,z])=>[p[0]+x*c-y*s,p[1]+x*s+y*c,p[2]+z];
  // Schematic body/legs indicate heading, not measured joint geometry.
  const corners=[[-.3,-.15,0],[.3,-.15,0],[.3,.15,0],[-.3,.15,0]];
  ctx.lineWidth=2;
  for(let i=0;i<4;i++){
   line(world(corners[i]),world(corners[(i+1)%4]),'#ffb76b');
   const [x,y]=corners[i];line(world([x,y,0]),world([x,y,-.25]),'#ffb76b');
  }
  line(world([0,0,0]),world([.65,0,0]),'#ffdb92');ctx.lineWidth=1;
 }
 const axes=[[[1,0,0],'#f18d82','X'],[[0,1,0],'#70dbac','Y'],[[0,0,1],'#82b8f1','Z']];
 for(const [v,c,label] of axes){const end=center.map((x,i)=>x+v[i]);line(center,end,c);const p=project(end,w,h);if(Number.isFinite(p[0])){ctx.fillStyle=c;ctx.fillText(label,p[0]+5,p[1]-5);}}
}
$('fit').onclick=()=>{autoFit=true;follow=false;draw();};
$('reset').onclick=()=>{autoFit=false;cameraZoom=1;follow=true;draw();};
$('top').onclick=()=>{pitch=Math.PI/2;yaw=0;$('fit').click();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag||follow)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];autoFit=false;if(e.shiftKey){follow=false;pan[0]+=dx;pan[1]+=dy;}else{yaw+=dx*.008;pitch=Math.max(.05,Math.min(Math.PI/2,pitch+dy*.008));}draw();};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();if(follow){cameraZoom=Math.max(.5,Math.min(2,cameraZoom*Math.exp(-e.deltaY*.001)));draw();return;}autoFit=false;scale=Math.max(.001,Math.min(260,scale*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
new ResizeObserver(draw).observe(canvas);
function markStale(name,stale){$(name+'Stale').style.display=stale?'block':'none';if(name==='rgb')$('rgb').style.opacity=stale?'.35':'1';if(name==='map')$('mapImage').style.opacity=stale?'.35':'1';}
async function poll(){if(polling)return;polling=true;clearTimeout(pollTimer);$('reconnect').disabled=true;
 const started=performance.now(),abort=new AbortController(),timer=setTimeout(()=>abort.abort(),2500);let delay=null;
 try{const response=await fetch('/api/frame',{signal:abort.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const incoming=await response.json();
  if(data?.session_id!==incoming.session_id){autoFit=false;follow=true;cameraPose=null;cameraZoom=1;pan=[0,0];}
  data=incoming;offline=!!data.finished||data.session_age>2;
  if(!offline&&data.pose_overlay)cameraPose={position:[...data.pose.position],yaw:data.pose.yaw};
  delay=data.finished?null:1000/data.fps;$('connection').textContent=data.finished?'本轮运行已结束':offline?'主程序心跳已过期':'已连接';$('reconnect').hidden=!data.finished;
  $('demo').textContent=data.demo?'演示数据':'';
  if(data.cloud){$('cloudEmpty').style.display='none';$('cloudMeta').textContent=data.cloud.accumulated?`累计场景：${data.cloud.count} 个体素 · 显示 ${data.cloud.display_count} 点 · 浅灰为地面`:'未标定 · 当前帧点云';
   if(follow&&data.pose_overlay)center=[...data.pose.position];}
  if(!data.cloud){$('cloudEmpty').style.display='grid';}
  markStale('cloud',offline||!!data.cloud?.stale);
  const metrics=data.performance;
  if(metrics){$('performance').textContent=`显示 ${metrics.display_fps.toFixed(1)} 帧/秒 · 点云年龄 ${((data.cloud?.age||0)*1000).toFixed(0)} ms`;
   $('cloudStale').textContent=offline?'数据源已断开':metrics.input_stale?'输入观测已过期':'点云显示更新延迟';
   $('mapStale').textContent=offline?'数据源已断开':metrics.input_stale?'输入观测已过期':'地图更新延迟';}
  $('task').textContent=data.status?.state==='observe'?'':`${data.status?.mode||''} · ${data.status?.state||''}`;
  if(data.map?.ready){$('mapEmpty').style.display='none';$('mapImage').style.display='block';
   const url='data:image/png;base64,'+data.map.png;if($('mapImage').getAttribute('src')!==url)$('mapImage').src=url;

  }else{$('mapImage').style.display='none';$('mapEmpty').style.display='grid';$('mapEmpty').textContent=data.map?.reason||'等待建图';}
  markStale('map',offline||!!data.map?.stale);
  if(data.rgb){$('rgbEmpty').style.display='none';$('rgb').style.display='block';const url='data:image/jpeg;base64,'+data.rgb.jpeg;if($('rgb').getAttribute('src')!==url)$('rgb').src=url;
}
  if(!data.rgb){$('rgb').style.display='none';$('rgbEmpty').style.display='grid';}
  markStale('rgb',offline||!!data.rgb?.stale);
  $('errors').textContent=Object.entries({...data.errors,...(data.status?.error?{run:data.status.error}:{})}).map(([k,v])=>k+': '+v).join('\n');draw();
 }catch(error){offline=true;delay=null;$('connection').textContent='连接中断 · 已停止刷新';$('reconnect').hidden=false;markStale('cloud',true);markStale('rgb',true);markStale('map',true);$('errors').textContent='数据源不可用，请恢复连接后重试。';draw();}
 finally{clearTimeout(timer);polling=false;$('reconnect').disabled=false;if(delay!==null)pollTimer=setTimeout(poll,Math.max(0,delay-(performance.now()-started)));}}
$('reconnect').onclick=()=>{$('connection').textContent='正在重新连接…';poll();};
poll();
</script>
</html>
