<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go2</title>
<style>
:root{color-scheme:light;font:13px/1.5 system-ui,sans-serif;background:#edf0f2;color:#303a43}
*{box-sizing:border-box}html{width:100%;min-height:100%}body{margin:0;padding:16px;min-height:100vh}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.panel{min-width:0;display:flex;flex-direction:column;border:1px solid #d4dadd;border-radius:6px;background:#fff;overflow:hidden}
.panel.expanded{grid-column:1/-1}.panel:first-child{order:3;grid-column:1/-1}.panel:first-child .viewport{height:180px;aspect-ratio:auto;background:#f3f5f6}
.panelhead{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e6eaec}h2{font-size:14px;font-weight:600;margin:0}
.viewport{position:relative;aspect-ratio:16/9;background:#f9f9f9;overflow:hidden}
.viewport canvas,.viewport img{position:absolute;inset:0;width:100%;height:100%;display:block}.viewport canvas{touch-action:none;cursor:grab}.viewport img{object-fit:contain;display:none}
#boxMap{pointer-events:none;cursor:default}.box-key{display:inline-block;width:15px;height:9px;margin-right:4px;border:2px solid #006e63}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#657580;pointer-events:none;padding:16px}
.stale{position:absolute;top:10px;left:10px;color:#754300;background:#fff0cf;padding:4px 8px;display:none}
.tools{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap;align-items:center}
button{border:1px solid #cbd4da;background:#fff;color:#405461;padding:4px 10px;border-radius:4px;cursor:pointer}button:hover,button[aria-pressed="true"]{background:#e7f0f6;border-color:#87a8be;color:#174d70}
.legend{padding:8px 12px;color:#657580;font-size:12px}.legend span{white-space:nowrap;margin-right:10px}
.dot{display:inline-block;width:8px;height:8px;margin-right:4px;background:var(--color)}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 2px 0;color:#596b78;font-size:12px}
#demo,#viewMode,#errors{color:#955017}#viewMode:empty,#errors:empty{display:none}#viewMode{font-size:12px;padding:6px 12px 0}
#errors{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;font-size:12px}
#interaction,#windowInteraction{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#405461;margin:8px 0}#interaction:empty,#windowInteraction:empty{display:none}
.height-key{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px}.height-ramp{height:7px;width:120px;background:linear-gradient(to right,#440154,#3b528b,#21918c,#5ec962,#fde725);border-radius:3px}
@media(max-width:1000px){body{padding:8px}.grid{grid-template-columns:1fr}.panel:first-child{grid-column:auto}}
</style>
<main class="grid">
 <section class="panel"><div class="panelhead"><h2>前置 RGB</h2></div>
 <div class="viewport"><img id="rgb" alt="前置 RGB"><div id="rgbEmpty" class="empty">等待图像</div><div id="rgbStale" class="stale">图像已过期</div></div></section>
 <section class="panel"><div class="panelhead"><h2>全局路线与局部碰撞地图</h2><button id="mapSize" aria-pressed="false">放大地图</button></div>
 <div class="viewport"><img id="mapImage" alt="导航地图"><canvas id="boxMap" role="img" aria-label="地图箱位"></canvas><div id="mapEmpty" class="empty">等待建图</div><div id="mapStale" class="stale">地图已过期</div></div>
 <div class="legend" id="boxLegend" hidden><span><i class="box-key"></i>已记录的箱位</span></div>
 <div class="legend"><span><i class="dot" style="--color:#afa8a4"></i>未知</span><span><i class="dot" style="--color:#f2f2f2"></i>自由</span><span><i class="dot" style="--color:#5e5853"></i>全局障碍</span><span><i class="dot" style="--color:#df4137"></i>局部障碍</span><span><i class="dot" style="--color:#2060a5"></i>实验边界</span><span><i class="dot" style="--color:#1969eb"></i>当前路线</span><span><i class="dot" style="--color:#46785a"></i>轨迹</span></div></section>
 <section class="panel"><div class="panelhead"><h2>累计点云图 · 雷达跟随视角</h2></div>
 <div class="viewport"><canvas id="cloud" aria-label="累计点云"></canvas><div id="cloudEmpty" class="empty">等待点云</div><div id="cloudStale" class="stale">点云已过期</div></div>
 <div class="tools"><button id="reset" aria-pressed="true">背后跟随</button><button id="fit" aria-pressed="false">全图</button><button id="top">俯视</button><button id="heightBand" aria-pressed="true">高度切片</button></div>
 <div id="viewMode"></div><div class="legend"><div id="cloudMeta">等待点云</div><div class="height-key"><span id="zMin"></span><i class="height-ramp"></i><span id="zMax"></span><span id="heightLabel">高度配色 · 历史点云仅供回看</span></div></div></section>
</main>
<div class="status"><span id="connection">连接中</span><button id="reconnect" hidden>重新连接</button><span id="demo"></span><span id="task"></span><span id="performance"></span></div>
<div id="errors" role="status"></div>
<div id="windowInteraction" role="status"></div><div id="interaction" role="status"></div>
<script src="/box_map.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('cloud'), ctx=canvas.getContext('2d');
const boxMap=new BoxMapOverlay($('boxMap'),renderWindowStatus);
let data=null, yaw=-.75, pitch=.7, scale=42, center=[0,0,0], pan=[0,0], drag=null, autoFit=false, offline=true;
let follow=true, heightSlice=true;
let pollTimer=null, polling=false, cameraPose=null, cameraZoom=1;
const fallbackColors=['#440154','#3b528b','#21918c','#5ec962','#fde725'];
// Camera in robot coordinates: 3.2 m behind, 2.7 m above the base;
// look toward 1.2 m ahead / 0.45 m above the base, with a 72 degree vertical FOV.
function rearProject(p,pose,w,h,zoom=1){
 const dx=p[0]-pose.position[0],dy=p[1]-pose.position[1],dz=p[2]-pose.position[2];
 const c=Math.cos(pose.yaw),s=Math.sin(pose.yaw);
 const x=dx*c+dy*s+3.2,y=-dx*s+dy*c,z=dz-2.7;
 const length=Math.hypot(4.4,2.25),fx=4.4/length,fz=-2.25/length;
 const depth=x*fx+z*fz;
 if(depth<=.15)return [NaN,NaN,depth];
 const focal=h*.5/Math.tan(Math.PI/5)*zoom;
 return [w/2-y*focal/depth,h/2-(-fz*x+fx*z)*focal/depth,depth];
}
function project(p,w,h){
 if(follow&&cameraPose)return rearProject(p,cameraPose,w,h,cameraZoom);
 const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];
 const u=Math.cos(yaw)*x-Math.sin(yaw)*y,v=Math.sin(yaw)*x+Math.cos(yaw)*y;
 return [w/2+pan[0]+u*scale,h/2+pan[1]-(v*Math.sin(pitch)+z*Math.cos(pitch))*scale,v*Math.cos(pitch)-z*Math.sin(pitch)];}
function fitMap(w,h){
 const points=data?.cloud?.points||[], bounds=points.filter(p=>p.every(Number.isFinite));
 if(data?.pose_overlay)bounds.push(data.pose.position);
 if(!bounds.length)return;
 const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 for(const p of bounds)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i]);}
 center=lo.map((v,i)=>(v+hi[i])/2);pan=[0,0];
 let maxU=1,maxV=1;
 for(const p of bounds){const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];
  maxU=Math.max(maxU,Math.abs(Math.cos(yaw)*x-Math.sin(yaw)*y));
  maxV=Math.max(maxV,Math.abs((Math.sin(yaw)*x+Math.cos(yaw)*y)*Math.sin(pitch)+z*Math.cos(pitch)));}
 scale=Math.max(.001,Math.min(w*.42/maxU,h*.42/maxV));
}
function draw(){const box=canvas.getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 if(autoFit||(follow&&!cameraPose))fitMap(w,h);
 if(follow&&cameraPose)center=[...cameraPose.position];
 const poseNotice=offline?'数据源已断开，视角已冻结':data?.pose_overlay_reason==='timestamp_mismatch'?'点云与位姿时间未对齐，视角已冻结':data?.pose_overlay_reason==='frame_mismatch'?'点云与位姿坐标系不一致，视角已冻结':'位姿显示不可用，视角已冻结';
 $('viewMode').textContent=follow?(cameraPose?(offline||!data?.pose_overlay?poseNotice:''):'等待位姿，暂示全图'):'';
 canvas.title=follow?'滚轮缩放':'拖动旋转 · 滚轮缩放 · Shift + 拖动平移';
 $('reset').setAttribute('aria-pressed',String(follow));$('fit').setAttribute('aria-pressed',String(autoFit));
 const calibrated=!!data?.cloud?.ground_relative_z, sliced=heightSlice&&calibrated;
 const style=data?.cloud?.style, [zmin,zmax]=style?.height_range||[.10,.28];
 const cm=z=>Math.round(100*z)+' cm';
 $('zMin').textContent=cm(zmin);$('zMax').textContent=cm(zmax);
 $('heightBand').setAttribute('aria-pressed',String(sliced));$('heightBand').disabled=!calibrated;
 $('heightBand').textContent=!calibrated?'未标定 · 原始点云':sliced?'高度切片 '+Math.round(zmin*100)+'–'+cm(zmax):
   Number.isFinite(style?.point_ceiling)?'含近地点 · 最高 '+cm(style.point_ceiling):'全部高度';
 $('heightLabel').textContent=!calibrated?'原坐标系 Z 配色（两端截断）':sliced?'高度配色 · 历史点云仅供回看':'高度配色（两端截断）';
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#f9f9f9';ctx.fillRect(0,0,w,h);
 const line=(a,b,c)=>{a=project(a,w,h);b=project(b,w,h);if(!Number.isFinite(a[0])||!Number.isFinite(b[0]))return;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();};
 if(!follow){
  const spacing=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(w,h)/Math.max(scale,.001)/16))));
  const cx=Math.round(center[0]/spacing)*spacing,cy=Math.round(center[1]/spacing)*spacing;
  for(let n=-10;n<=10;n++){line([cx+n*spacing,cy-10*spacing,0],[cx+n*spacing,cy+10*spacing,0],'#e1e6e8');line([cx-10*spacing,cy+n*spacing,0],[cx+10*spacing,cy+n*spacing,0],'#e1e6e8');}
 }
 if(data?.cloud){ctx.globalAlpha=(offline||data.cloud.stale)? .32:1;
  const palette=data.cloud.style?.palette||fallbackColors;
  const pts=data.cloud.points.filter(p=>{
   if(!p.every(Number.isFinite)||(calibrated&&Number.isFinite(style?.point_ceiling)&&p[2]>style.point_ceiling)||
      (sliced&&(p[2]<zmin||p[2]>zmax)))return false;
   if(follow&&cameraPose){const dx=p[0]-cameraPose.position[0],dy=p[1]-cameraPose.position[1],dz=p[2]-cameraPose.position[2],c=Math.cos(cameraPose.yaw),s=Math.sin(cameraPose.yaw);
    if(Math.abs(dx*c+dy*s)>7||Math.abs(-dx*s+dy*c)>6||dz<-.8||dz>2.2)return false;}
   return true;
  }).map(p=>{let s=project(p,w,h);s.push(p[2]);return s;}).filter(p=>p[0]>=0&&p[0]<w&&p[1]>=0&&p[1]<h).sort((a,b)=>b[2]-a[2]);
  $('cloudMeta').textContent=data.cloud.accumulated?`历史点云：${data.cloud.count} 个体素 · 当前视图 ${pts.length} 点 · 通行判断见实时地图`:'未标定 · 当前帧点云';
  for(const p of pts){const t=Math.max(0,Math.min(palette.length-1,Math.floor((p[3]-zmin)/(zmax-zmin)*(palette.length-1))));ctx.fillStyle=!sliced&&calibrated&&Math.abs(p[3])<=.08?'#b8c4cf':palette[t];ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1.25,2*h/684),0,2*Math.PI);ctx.fill();}ctx.globalAlpha=1;
 }
 if(!offline&&data?.pose_overlay){
  const p=data.pose.position,q=data.pose.yaw,c=Math.cos(q),s=Math.sin(q);
  const world=([x,y,z])=>[p[0]+x*c-y*s,p[1]+x*s+y*c,p[2]+z];
  // Simulation's schematic body: orientation reference, not measured joints.
  const body=[[-.26,-.18,.02],[.30,-.18,.02],[.30,.18,.02],[-.26,.18,.02],[-.26,-.18,.24],[.30,-.18,.24],[.30,.18,.24],[-.26,.18,.24]];
  ctx.lineWidth=1.8;
  for(const [a,b] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])line(world(body[a]),world(body[b]),'#4d8c3b');
  line(world([0,0,.28]),world([.75,0,.28]),'#4d8c3b');
  line(world([.75,0,.28]),world([.57,.09,.28]),'#4d8c3b');line(world([.75,0,.28]),world([.57,-.09,.28]),'#4d8c3b');ctx.lineWidth=1;
 }
 if(!follow){const axes=[[[1,0,0],'#b94c42','X'],[[0,1,0],'#367858','Y'],[[0,0,1],'#456b9a','Z']];
  for(const [v,c,label] of axes){const end=center.map((x,i)=>x+v[i]);line(center,end,c);const p=project(end,w,h);if(Number.isFinite(p[0])){ctx.fillStyle=c;ctx.fillText(label,p[0]+5,p[1]-5);}}}
}
$('mapSize').onclick=()=>{const expanded=$('mapImage').closest('.panel').classList.toggle('expanded');$('mapSize').setAttribute('aria-pressed',String(expanded));$('mapSize').textContent=expanded?'双图并排':'放大地图';};
$('heightBand').onclick=()=>{heightSlice=!heightSlice;draw();};
$('fit').onclick=()=>{autoFit=true;follow=false;draw();};
$('reset').onclick=()=>{autoFit=false;cameraZoom=1;follow=true;draw();};
$('top').onclick=()=>{pitch=Math.PI/2;yaw=0;$('fit').click();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag||follow)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];autoFit=false;if(e.shiftKey){follow=false;pan[0]+=dx;pan[1]+=dy;}else{yaw+=dx*.008;pitch=Math.max(.05,Math.min(Math.PI/2,pitch+dy*.008));}draw();};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();if(follow){cameraZoom=Math.max(.5,Math.min(2,cameraZoom*Math.exp(-e.deltaY*.001)));draw();return;}autoFit=false;scale=Math.max(.001,Math.min(260,scale*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
new ResizeObserver(draw).observe(canvas);
function markStale(name,stale){$(name+'Stale').style.display=stale?'block':'none';if(name==='rgb')$('rgb').style.opacity=stale?'.35':'1';if(name==='map')$('mapImage').style.opacity=stale?'.35':'1';}
function windowStatus(row,valid,remembered){
 const states={confirming:'正在确认',missing:'等待首次确认',searching:'正在找箱子',tracked:'等待新扫描'};
 const reasons={filling_window:'正在收集点云',await_distinct_window:'等下一段点云',await_fresh_refit:'正在用新点云核对位置',
  no_two_face_fit:'还在找符合尺寸的箱面',
  wait_for_stationary_window:'等机器人站稳',outside_registration_region:'超出初始搜索区',
  ambiguous:'有多个可能的箱子',surface_evidence_expired:'箱面的点云已过期',discontinuous_fit:'箱子位置或方向跳变'};
 const parts=['多帧认箱',row.object_id,valid?'本次扫描已确认':remembered?'采用地图箱位':states[row.tracking_state]];
 if(valid&&row.surfaces)parts.push(({top:'顶面',top_and_side:'顶面 + 侧面',two_sides:'两个侧面'})[row.surfaces]||row.surfaces);
 if(valid&&row.center)parts.push('中心 ('+row.center.slice(0,2).map(v=>v.toFixed(2)).join(', ')+') m');
 if(valid&&Number.isFinite(row.long_axis_rad))parts.push('长边方向 '+Math.round(row.long_axis_rad*180/Math.PI)+'°');
 return parts.concat(reasons[row.invalid_reason]??row.invalid_reason).filter(Boolean).join(' · ');
}
function renderWindowStatus(fit,now,stale){
 const lines=(fit?.detections||[]).map(row=>windowStatus(row,row.valid&&!stale&&row.captured_at<=now&&now<row.expires_at,fit.last_seen?.[row.object_id]));
 if(fit?.error)lines.unshift('多帧认箱 · '+fit.error);
 const value=lines.join('\n');
 if($('windowInteraction').textContent!==value)$('windowInteraction').textContent=value;
}
let boxPolling=false;
async function pollBox(){
 if(boxPolling||offline||!data?.box_feed||document.hidden)return;
 boxPolling=true;
 const session=data.session_id,started=performance.now(),abort=new AbortController();
 const timer=setTimeout(()=>abort.abort(),750);
 try{
  const response=await fetch('/api/box',{signal:abort.signal,cache:'no-store'});
  if(response.ok&&session===data?.session_id)boxMap.updateTracking(await response.json(),started);
 }catch(error){/* The map also carries the last measured box and its original expiry. */}
 finally{clearTimeout(timer);boxPolling=false;}
}
setInterval(pollBox,80);
async function poll(){if(polling)return;polling=true;clearTimeout(pollTimer);$('reconnect').disabled=true;
 const started=performance.now(),abort=new AbortController(),timer=setTimeout(()=>abort.abort(),2500);let delay=null;
 try{const response=await fetch('/api/frame',{signal:abort.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const incoming=await response.json();
  if(data?.session_id!==incoming.session_id){autoFit=false;follow=true;cameraPose=null;cameraZoom=1;pan=[0,0];}
  const area=incoming.map?.world_boundary, cloud=incoming.cloud;
  if(area && cloud?.accumulated && cloud.frame===incoming.map.frame){
   const [xmin,xmax]=area.x_limits, [ymin,ymax]=area.y_limits;
   cloud.points=cloud.points.filter(([x,y])=>x>=xmin && x<=xmax && y>=ymin && y<=ymax);
   cloud.display_count=cloud.points.length;
  }
  data=incoming;offline=!!data.finished||data.session_age>2;
  $('boxLegend').hidden=!(data.box_window&&data.map?.projection);
  boxMap.update(data,offline,started);
  if(!offline&&data.pose_overlay)cameraPose={position:[...data.pose.position],yaw:data.pose.yaw};
  delay=data.finished?null:1000/data.fps;$('connection').textContent=data.finished?'本轮运行已结束':offline?'主程序心跳已过期':'已连接';$('reconnect').hidden=!data.finished;
  $('demo').textContent=data.evidence_label||(data.demo?'演示数据':'');
  if(data.cloud){$('cloudEmpty').style.display='none';$('cloudMeta').textContent=data.cloud.accumulated?`历史点云：${data.cloud.count} 个体素 · 显示 ${data.cloud.display_count} 点 · 通行判断见实时地图`:
    (data.cloud.ground_relative_z?'当前帧点云 · 高度从地面算起':'未标定 · 当前帧点云（不作地面高度切片）');
   if(follow&&data.pose_overlay)center=[...data.pose.position];}
  if(!data.cloud){$('cloudEmpty').style.display='grid';}
  markStale('cloud',offline||!!data.cloud?.stale);
  const metrics=data.performance;
  if(metrics){$('performance').textContent=`显示 ${metrics.display_fps.toFixed(1)} 帧/秒 · 点云年龄 ${((data.cloud?.age||0)*1000).toFixed(0)} ms`;
   $('cloudStale').textContent=offline?'数据源已断开':metrics.input_stale?'输入观测已过期':'点云显示更新延迟';
   $('mapStale').textContent=offline?'数据源已断开':metrics.input_stale?'输入观测已过期':'地图更新延迟';}
  const skill=data.map?.skill;
  const perception=data.map?.interaction_perception;
  const observations=perception?.detections||[];
  const details=observations.map(o=>{
   const quality=Number.isFinite(o.fit_residual_m)?` · 拟合残差 ${(o.fit_residual_m*100).toFixed(1)} cm`:'';
   const measured=o.geometry_verified?'几何已核验':'仅观测 · 几何待核验';
   const observationAge=data.map?.interaction_observation_age_s;
   const ageSeconds=Number.isFinite(data.map?.updated_at)&&Number.isFinite(o.captured_at)
    ?Math.max(0,data.map.updated_at+(data.map.age||0)-o.captured_at)
    :Number.isFinite(observationAge)?observationAge+(data.map?.age||0):Infinity;
   const age=Number.isFinite(ageSeconds)?` · 观测年龄 ${(ageSeconds*1000).toFixed(0)} ms`:'';
   const lease=Number.isFinite(o.expires_at)&&Number.isFinite(o.captured_at)?o.expires_at-o.captured_at:0;
   const valid=o.valid&&!offline&&!data.map?.stale&&ageSeconds<lease;
   if(perception.geometry_source==='window_two_faces')return windowStatus(o,valid,data.box_window?.last_seen?.[o.object_id]);
   const reasons={'No fully constrained visible box':'这一帧还没看清完整箱体','Awaiting distinct confirming scans':'等下一帧确认'};
   return `接触前核对 · ${o.object_id} · ${valid?'本次扫描已确认':reasons[o.invalid_reason]||o.invalid_reason||'等待新扫描'} · ${measured}${quality}${age}`;
  });
  if(data.map?.interaction_perception_error)details.push('箱面扫描 · '+data.map.interaction_perception_error);
  const stage=data.map?.decision?.stage_tracking;
  if(['box_approach','box_stage_brake','box_stage_translate'].includes(data.map?.phase)&&Number.isFinite(stage?.stage_error_m)){
   details.push(`距预定站位 ${(stage.stage_error_m*100).toFixed(1)} cm${stage.stalled?' · 实测前进停滞':''}`);
  }
  const centering=data.map?.decision?.lid_centering;
  if(data.map?.decision?.skill_state==='align_lateral'&&Number.isFinite(centering?.stage_error_m)){
   details.push(`箱顶横向误差 ${(centering.stage_error_m*100).toFixed(1)} cm · 实测向中心速度 ${(centering.measured_closing_mps*100).toFixed(1)} cm/s`);
  }
  if(data.map?.phase==='box_turn'&&Number.isFinite(data.map?.decision?.measured_rebound_rad)){
   details.push(`转身误差 ${Math.abs(data.map.decision.heading_error_rad*180/Math.PI).toFixed(1)}° · 实测回弹 ${(data.map.decision.measured_rebound_rad*180/Math.PI).toFixed(1)}°`);
  }
  if(data.map?.phase==='box_turn'&&data.map.decision?.turn_clear===false)details.push('转向检查 · 当前空间不足以转身');
  const waits={braking_for_lid_recheck:'等横移停稳',waiting_for_stopped_lid:'等停稳后的箱顶点云',stopped_pose_outside_standoff_or_heading:'距离或朝向超出范围',stopped_head_misses_short_face:'机头落点或接触高度不足',stopped_head_wide_of_face:'机头落点超出端面',waiting_for_box_face:'等新的箱面扫描',waiting_for_settled_box:'等箱位测稳',waiting_for_push_map:'等新的地图扫描',push_path_blocked_or_unknown:'推箱范围内有障碍或未观测格'};
  const wait=data.map?.decision?.precontact_wait;
  if(wait)details.push('接触前核对 · '+(waits[wait]||wait));
  const collision=data.map?.contact_collision;
  if(collision&&skill&&collision.reason!=='no_contact_scan'){
   const reason=collision.reason==='box_sweep_obstacle'?'箱子前移范围有障碍':collision.reason;
   const xy=collision.cell_xy_m;
   details.push('接触检查 · '+reason+(xy?' · 地图 ('+xy.map(v=>v.toFixed(2)).join(', ')+') m':''));
  }
  const trial=data.map?.first_push_result;
  if(trial){
   const moved=trial.first_push?.displacement_m;
   const outcome=trial.reason==='timed_push_released'?'推箱动作结束，已交回导航':trial.reason==='first_push_observed'?'已确认移动':trial.reason==='first_push_waiting_for_final_scan'?'等待箱面复测':'未确认沿推向移动';
   details.push('首次短推 · '+outcome+(Number.isFinite(moved)?' · 沿推向 '+(100*moved).toFixed(1)+' cm':''));
  }
  $('interaction').textContent=details.join('\n');
  const choices={recover:'正在脱离膨胀区',navigate:'沿路线走',push:'已选择推箱',explore:'正在探路',wait:'等待可走的路',failed:'找不到可走的路'};
  const phases={recheck_lid:'原地复核箱顶和落点',box_approach:'前往箱边',box_stage_brake:'前进停滞，刹停复核站位',box_stage_translate:'横移到原定站位',box_turn:'转向选定箱面',box_confirm:'已转正，等新的箱面扫描',turn_at_stage:'转向选定箱面',first_push_wait_scan:'停稳核对箱面',first_push_review:'停稳复测箱位',engage:'接近箱面',push:'推箱中',settle_contact:'停稳核对箱面',timed_push:'定时向前推箱',push_settle:'推后停稳',post_push_reobserve:'推后停稳，等待新点云',first_push_stop:'停止推箱'};
  $('task').textContent=[data.status?.mode,data.status?.state,phases[data.map?.phase]||data.map?.phase,choices[data.map?.decision?.kind],
   skill?`${skill.object_id} · ${phases[skill.state]||skill.state}`:null].filter(Boolean).join(' · ');
  if(data.map?.ready){$('mapEmpty').style.display='none';$('mapImage').style.display='block';
   const url='data:image/png;base64,'+data.map.png;if($('mapImage').getAttribute('src')!==url)$('mapImage').src=url;

  }else{$('mapImage').style.display='none';$('mapEmpty').style.display='grid';$('mapEmpty').textContent=data.map?.reason||'等待建图';}
  markStale('map',offline||!!data.map?.stale);
  if(data.rgb){$('rgbEmpty').style.display='none';$('rgb').style.display='block';const url='data:image/jpeg;base64,'+data.rgb.jpeg;if($('rgb').getAttribute('src')!==url)$('rgb').src=url;
}
  if(!data.rgb){$('rgb').style.display='none';$('rgbEmpty').style.display='grid';}
  markStale('rgb',offline||!!data.rgb?.stale);
  $('errors').textContent=Object.entries({...data.errors,...(data.status?.error?{run:data.status.error}:{})}).map(([k,v])=>k+': '+v).join('\n');draw();
 }catch(error){offline=true;boxMap.update(data,true,started);delay=null;$('connection').textContent='连接中断 · 已停止刷新';$('reconnect').hidden=false;markStale('cloud',true);markStale('rgb',true);markStale('map',true);$('interaction').textContent='';$('errors').textContent='数据源不可用，请恢复连接后重试。';draw();}
 finally{clearTimeout(timer);polling=false;$('reconnect').disabled=false;if(delay!==null)pollTimer=setTimeout(poll,Math.max(0,delay-(performance.now()-started)));}}
$('reconnect').onclick=()=>{$('connection').textContent='正在重新连接…';poll();};
poll();
</script>
</html>
