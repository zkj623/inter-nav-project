# Go2 EDU / Orin NX: topics confirmed received during the user hardware audit.
# map_frame is the upstream frame used for sensor alignment.
# run.py converts calibrated observations to a fixed per-run experiment frame.
network_interface: eth0
map_frame: odom
base_frame: base_link
odom_topic: /utlidar/robot_odom
lidar_topic: /utlidar/cloud_deskewed
# No standard RGB-D source was found. Custom compressed video is not depth.
camera_mode: unavailable  # unavailable | rgbd
front_video_topic: /frontvideostream
rgb_topic: ""
depth_topic: ""
camera_info_topic: ""
# This Go2, 2026-10-25: standing on level ground; height in upstream odom, metres.
# Recheck ground_z after odom resets or the floor/reference changes.
ground_z: -0.012
# 2026-10-27: use the supplied official base->radar URDF at the user's direction.
# Adopt base == base_link and radar origin == range origin for this robot.
# URDF rpy=[0, 2.8782, 0]; incoming cloud is already in odom: do not rotate it again.
lidar_origin_offset_base_m: [0.28945, 0.0, -0.046825]
lidar_max_range: 8.0
pose_cloud_tolerance_s: 0.05
image_sync_tolerance_s: 0.04
max_data_age_s: 0.4
max_position_jump_m: 0.5
max_orientation_jump_rad: 0.7
# Receipt alone does not establish calibration, filtering, DDS or motion readiness.
# Acceptance basis: measured ground + user-accepted URDF frame correspondence.
# This is not an independent physical survey or motion acceptance.
calibration_verified: true
# 2026-10-28: operator explicitly requested true for supervised point-nav trials.
# Test override only: dynamic deskew/self-filter acceptance remains incomplete.
deskew_and_self_filter_verified: true
# 2026-10-28: sensor recordings + motion-test 20261028T142816_831350Z;
# operator accepted physical response; includes command_timeout -> stopped.
# This does not certify physical network-loss or computer-failure protection.
communication_verified: true
# Same recording: 3 takeover stops; release stays latched until explicit re-arm.
# Operator also confirmed native joystick control still works after takeover.
remote_arbitration_verified: true
# Button bit mask in wireless_remote bytes 2:4; choose after inspecting remote.
takeover_button_mask: 4096
sport_state_topic: rt/sportmodestate
# 2026-10-27: operator confirmed 100 permits motion on this Go2 (Agile state).
# SportModeState.error_code is not the SportClient RPC return code.
# Only these device-specific state values may pass the telemetry state check.
sport_state_motion_codes: [100]
low_state_topic: rt/lowstate
