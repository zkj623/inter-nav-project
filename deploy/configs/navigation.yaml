# Shared algorithms come from stage1-go2-simulation-release; time is seconds.
mapping:
  x_limits: [-10.0, 10.0]
  y_limits: [-10.0, 10.0]
  grid_resolution: 0.1
  voxel_size: 0.1
  robot_radius: 0.30
  obstacle_inflation_radius: 0.40
  # Preserve this robot's reviewed, ground-relative navigation envelope.
  obstacle_height: [0.15, 0.63]
  point_height: [-0.1, 2.0]
  safe_recovery_y_limits: [-9.5, 9.5]
  sticky_free_scale: 0.25
max_forward_speed: 0.80
max_lateral_speed: 0.30
max_yaw_speed: 0.90
final_goal_slow_radius: 0.80
success_distance: 0.25
safe_base_height: 0.22
fall_height: 0.16
task_timeout_s: 300.0
tick_hz: 10.0
# Real RGB-D, measured full object envelopes and SDK contact-motion acceptance
# are prerequisites; single-camera preview does not enable interaction.
interaction_enabled: false
# Global routes keep the deployment clearance; local motion checks full body shape.
route_clearance: 0.40
navigation_half_width: 0.22
local_map_hz: 10.0
global_map_hz: 1.0
local_map_radius: 3.0
object_max_age_s: 0.75
recognition_max_age_s: 8.0
push_start_speed: 0.15
push_max_speed: 0.30
subnavigation_timeout_s: 80.0
inspection_timeout_s: 20.0
linear_acceleration: 0.50
yaw_acceleration: 1.50
