# Shared algorithms come from stage1-go2-simulation-release; time is seconds.
world_boundary: true
# Visually checked clear floor at the fixed start, in experiment metres.
# Set to null when starting elsewhere. Apply once, before the first scan is fused.
startup_clear_area:
  x_limits: [-0.45, 0.85]
  y_limits: [-0.40, 0.40]
mapping:
  # Experiment metres from the startup pose: X forward, Y left.
  x_limits: [-1.2, 5.0]
  y_limits: [-2.6, 0.9]
  grid_resolution: 0.1
  voxel_size: 0.1
  robot_radius: 0.30
  obstacle_inflation_radius: 0.30
  # Ground-relative metres. Discard higher endpoints before tracing free rays.
  obstacle_height: [0.10, 0.28]
  point_height: [-0.10, 0.28]
  sticky_free_scale: 0.25
max_forward_speed: 0.80
max_lateral_speed: 0.30
max_yaw_speed: 0.90
final_goal_slow_radius: 0.80
success_distance: 0.25
safe_base_height: 0.22
fall_height: 0.16
task_timeout_s: 300.0
tick_hz: 10.0
# The field box profile enables one measured short push.
interaction_enabled: false
# Global routes keep the deployment clearance; local motion checks full body shape.
route_clearance: 0.30
# Log-odds to turn previously free ground near a registered box into a map obstacle.
# Fresh LiDAR hits still block local motion immediately.
box_map_occupied_threshold: 2.25
navigation_half_width: 0.22
local_map_hz: 10.0
global_map_hz: 1.0
local_map_radius: 3.0
object_max_age_s: 0.75
push_start_speed: 0.15
push_max_speed: 0.30
subnavigation_timeout_s: 80.0
linear_acceleration: 0.50
yaw_acceleration: 1.50
