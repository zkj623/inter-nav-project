# Read-only sensor capture. Best-effort subscriptions accept both reliable and
# best-effort publishers; recorded message counts do not prove lossless delivery.
/bot1/cloud_registered_sparse:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/bot1/lidar_slam/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/livox/imu:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/tf:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 100
